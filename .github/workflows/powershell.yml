name: PowerShell and YARA validation

on:
  push:
    branches: [main]
    paths:
      - '**.ps1'
      - '**.psm1'
      - '**.psd1'
      - '**.yar'
      - '**.yara'
      - '.github/workflows/powershell.yml'
  pull_request:
    paths:
      - '**.ps1'
      - '**.psm1'
      - '**.psd1'
      - '**.yar'
      - '**.yara'
      - '.github/workflows/powershell.yml'
  schedule:
    - cron: '20 7 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PSScriptAnalyzer SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@6b2948b1944407914a58661c49941824d149734f
        with:
          path: .\
          recurse: true
          includeRule: '"PSAvoidGlobalAliases", "PSAvoidUsingConvertToSecureStringWithPlainText", "PSAvoidUsingPlainTextForPassword", "PSAvoidUsingInvokeExpression", "PSUsePSCredentialType", "PSAvoidUsingComputerNameHardcoded", "PSAvoidUsingUsernameAndPasswordParams"'
          output: results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psscriptanalyzer-sarif
          path: results.sarif
          if-no-files-found: warn

  validate:
    name: Blocking lint and rule compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reject analyzer errors and security findings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Force -Scope CurrentUser
          Import-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -ErrorAction Stop
          $securityRules = @(
              'PSAvoidGlobalAliases',
              'PSAvoidUsingConvertToSecureStringWithPlainText',
              'PSAvoidUsingPlainTextForPassword',
              'PSAvoidUsingInvokeExpression',
              'PSUsePSCredentialType',
              'PSAvoidUsingComputerNameHardcoded',
              'PSAvoidUsingUsernameAndPasswordParams'
          )
          $findings = @(
              Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
              Invoke-ScriptAnalyzer -Path . -Recurse -IncludeRule $securityRules
          ) | Sort-Object ScriptPath, Line, RuleName -Unique
          if ($findings) {
              $findings | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap | Out-String | Write-Host
              throw "$(@($findings).Count) blocking PowerShell analyzer finding(s)."
          }

      - name: Install YARA
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends yara

      - name: Compile every YARA rule file
        shell: bash
        run: |
          failed=0
          count=0
          while IFS= read -r -d '' rule; do
            count=$((count + 1))
            if yara -w "$rule" /dev/null; then
              echo "Compiled: $rule"
            else
              echo "::error file=$rule::YARA rule compilation failed"
              failed=1
            fi
          done < <(find . -type f \( -name '*.yar' -o -name '*.yara' \) -print0)
          if [ "$count" -eq 0 ]; then
            echo '::error::No YARA rule files were found'
            exit 1
          fi
          exit "$failed"
